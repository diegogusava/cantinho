<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<link rel="stylesheet" href="common.css">
<title>Aventura</title>
<style>
  .pad { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5; display: flex; gap: 14px; }
  .pad.left { left: 18px; }
  .pad.right { right: 18px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 79, 163, .75); color: #fff; font-size: 2rem; padding: 0; }
  .pad button.on { background: #ff4fa3; transform: scale(.94); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="hud"></div>
<a class="back" href="index.html">🏠</a>
<div class="banner" id="banner"></div>
<div class="pad left"><button data-key="left">◀</button><button data-key="right">▶</button></div>
<div class="pad right"><button data-key="jump">⬆</button></div>
<script src="common.js"></script>
<script src="cheer.js"></script>
<script>
const canvas = document.getElementById("game");
const ctx = setupCanvas(canvas);
const hud = document.getElementById("hud");
const banner = document.getElementById("banner");

const LEVELS = [
 [
  "                                                                      ",
  "                                                                      ",
  "                                                                      ",
  "                                                                      ",
  "                                                                      ",
  "                  ???         *****                             F     ",
  "                      ***     =====                             F     ",
  "      *****                                  *****      ***     F     ",
  "######################################################################",
  "######################################################################"
 ],
 [
  "                                                                                     ",
  "                                                                                     ",
  "                                                                                     ",
  "                                                                                     ",
  "                               ??                                                    ",
  "                      **      ****          ***     ***       **               F     ",
  "                              ====                  ===                        F     ",
  "        *****                                                         ****     F     ",
  "######################  ####################   ###############  #####################",
  "######################  ####################   ###############  #####################"
 ],
 [
  "                                                                                               ",
  "                                                                                               ",
  "                                                                                               ",
  "                                                                                               ",
  "                                         ??                     ***                            ",
  "                         ***            ****           ***      ===                      F     ",
  "                                        ====                ===                          F     ",
  "               E    ***            E            E                     E    ***  E        F     ",
  "#########################   ###########################   #####################################",
  "#########################   ###########################   #####################################"
 ],
 [
  "                                                                                                         ",
  "                                                                                                         ",
  "                                                                                                         ",
  "                                                ?   ?                                                    ",
  "                                                   ***                                                   ",
  "                  ***               ***            ===    ***         ***       ***                F     ",
  "                                               ==                     ===                          F     ",
  "            E               E                E    E               E                       E     ***F     ",
  "##################   ###############   ###################   ###################   ######################",
  "##################   ###############   ###################   ###################   ######################"
 ],
 [
  "                                                                                                                        ",
  "                                                                                                                        ",
  "                                                                                                                        ",
  "                                                                                                                        ",
  "                                         ?                                  ?                                           ",
  "               ***             ****     ***       ***                 ***               ***         ***           F     ",
  "                                =       ===                                ===                ==                  F     ",
  "         E              E           E       E                 E E               E                E          E ****F     ",
  "###############   ############    ################   #################   ###############   #########   #################",
  "###############   ############    ################   #################   ###############   #########   #################"
 ]
]
;

const ROWS = 10;
const GRAVITY = 30;
const RUN = 5;
const JUMP = 14;
const SOLID = "#=?";
const keys = { left: false, right: false, jump: false };

let level = 0;
let grid, enemies, player, stars, starsAtStart, state, timer, T, camX, offsetY, facing, prevJump;

function load() {
  grid = LEVELS[level].map((row) => [...row]);
  enemies = [];
  grid.forEach((row, r) => row.forEach((tile, c) => {
    if (tile === "E") { enemies.push({ x: c + 0.1, y: r + 0.2, dir: -1, alive: true }); row[c] = " "; }
  }));
  player = { x: 2, y: 7, vx: 0, vy: 0, onGround: false };
  stars = starsAtStart;
  state = "play";
  facing = 1;
  hud.textContent = "Fase " + (level + 1) + " · ⭐ " + stars;
  banner.textContent = "Fase " + (level + 1);
  setTimeout(() => { if (state === "play") banner.textContent = ""; }, 1200);
}

const solid = (c, r) => c < 0 || c >= grid[0].length || (r >= 0 && r < ROWS && SOLID.includes(grid[r][c]));
const tileAt = (x, y) => (grid[Math.floor(y)] || [])[Math.floor(x)];

function movePlayer(dt) {
  const W_ = 0.7, H_ = 0.9;
  player.vx = (keys.right - keys.left) * RUN;
  if (player.vx) facing = Math.sign(player.vx);
  if (keys.jump && !prevJump && player.onGround) { player.vy = -JUMP; beep(520, 0.15); }
  if (!keys.jump && player.vy < -5) player.vy = -5;
  prevJump = keys.jump;
  player.vy += GRAVITY * dt;

  player.x += player.vx * dt;
  for (let r = Math.floor(player.y); r <= Math.floor(player.y + H_ - 0.01); r++) {
    if (player.vx > 0 && solid(Math.floor(player.x + W_), r)) player.x = Math.floor(player.x + W_) - W_ - 0.001;
    if (player.vx < 0 && solid(Math.floor(player.x), r)) player.x = Math.floor(player.x) + 1.001;
  }

  player.y += player.vy * dt;
  player.onGround = false;
  for (let c = Math.floor(player.x); c <= Math.floor(player.x + W_ - 0.01); c++) {
    if (player.vy > 0 && solid(c, Math.floor(player.y + H_))) {
      player.y = Math.floor(player.y + H_) - H_ - 0.001;
      player.vy = 0;
      player.onGround = true;
    } else if (player.vy < 0 && solid(c, Math.floor(player.y))) {
      const r = Math.floor(player.y);
      player.y = r + 1.001;
      player.vy = 0;
      if (grid[r][c] === "?") { grid[r][c] = "="; collect(); }
    }
  }
}

function collect() {
  stars++;
  hud.textContent = "Fase " + (level + 1) + " · ⭐ " + stars;
  beep(1000, 0.12);
}

function die() {
  state = "dead";
  timer = 1.2;
  player.vy = -10;
  cheer("retry");
}

function win() {
  state = "won";
  timer = 2.8;
  banner.textContent = level === LEVELS.length - 1 ? "Você zerou o jogo! 🏆" : "Fase " + (level + 1) + " completa! 💖";
  cheer("win");
  beep(880, 0.4);
}

function moveEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.dir * 1.5 * dt;
    const front = e.x + (e.dir > 0 ? 0.8 : 0);
    if (solid(Math.floor(front), Math.floor(e.y + 0.4)) || !solid(Math.floor(front), Math.floor(e.y + 1.1))) e.dir *= -1;
    const overlap = Math.abs(e.x - player.x) < 0.75 && Math.abs(e.y - player.y) < 0.8;
    if (!overlap) continue;
    if (player.vy > 0 && player.y + 0.9 < e.y + 0.6) {
      e.alive = false;
      player.vy = -9;
      beep(700, 0.15);
    } else {
      die();
    }
  }
}

function update(dt) {
  if (state === "dead") {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if ((timer -= dt) <= 0) load();
    return;
  }
  if (state === "won") {
    if ((timer -= dt) <= 0) {
      level = (level + 1) % LEVELS.length;
      starsAtStart = level === 0 ? 0 : stars;
      load();
    }
    return;
  }
  movePlayer(dt);
  moveEnemies(dt);
  if (state !== "play") return;
  const centerX = player.x + 0.35;
  const centerY = player.y + 0.45;
  if (tileAt(centerX, centerY) === "*") { grid[Math.floor(centerY)][Math.floor(centerX)] = " "; collect(); }
  if (tileAt(centerX, centerY) === "F") win();
  if (player.y > ROWS + 1) die();
}

function draw() {
  T = Math.min(H / ROWS, W / 12);
  offsetY = (H - ROWS * T) / 3;
  const cols = grid[0].length;
  camX = Math.max(0, Math.min(cols - W / T, player.x - W / T * 0.35));
  ctx.fillStyle = "#bfe8ff";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#a9744a";
  ctx.fillRect(0, offsetY + ROWS * T, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = T * 0.9 + "px system-ui";
  for (let i = 0; i < 12; i++) ctx.fillText("☁️", (((i * 9 - camX * 0.4) % 108) + 108) % 108 * T - T * 4, offsetY + T * (1 + (i % 3)));

  const screenX = (x) => (x - camX) * T;
  const screenY = (y) => offsetY + y * T;
  for (let c = Math.floor(camX); c < Math.min(cols, camX + W / T + 1); c++) {
    for (let r = 0; r < ROWS; r++) {
      const tile = grid[r][c];
      const x = screenX(c);
      const y = screenY(r);
      if (r >= 8 && tile !== "#") {
        ctx.fillStyle = "#5a3d2b";
        ctx.fillRect(x, y, T + 1, T + 1);
      }
      if (tile === "#") {
        ctx.fillStyle = r > 0 && grid[r - 1][c] === "#" ? "#a9744a" : "#6fcf6f";
        ctx.fillRect(x, y, T + 1, T + 1);
      } else if (tile === "=" || tile === "?") {
        ctx.fillStyle = tile === "?" ? "#ffd54f" : "#c98a4b";
        ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
        ctx.fillStyle = "#fff";
        ctx.fillText(tile === "?" ? "?" : "", x + T / 2, y + T / 2);
      } else if (tile === "*") {
        ctx.fillText("⭐", x + T / 2, y + T / 2);
      } else if (tile === "F") {
        ctx.fillStyle = "#888";
        ctx.fillRect(x + T * 0.45, y, T * 0.1, T);
        if (grid[r - 1][c] !== "F") ctx.fillText("🚩", x + T * 0.9, y + T * 0.4);
      }
    }
  }
  enemies.forEach((e) => { if (e.alive) ctx.fillText("🐌", screenX(e.x + 0.4), screenY(e.y + 0.4)); });
  ctx.save();
  ctx.translate(screenX(player.x + 0.35), screenY(player.y + 0.45));
  ctx.scale(-facing, 1);
  ctx.fillText(state === "dead" ? "😵" : "🐰", 0, 0);
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  update(Math.min((now - last) / 1000, 0.05));
  last = now;
  draw();
  requestAnimationFrame(loop);
}

document.querySelectorAll(".pad button").forEach((button) => {
  const set = (value) => (event) => { event.preventDefault(); keys[button.dataset.key] = value; button.classList.toggle("on", value); };
  button.addEventListener("pointerdown", set(true));
  ["pointerup", "pointercancel", "pointerleave"].forEach((type) => button.addEventListener(type, set(false)));
  button.addEventListener("contextmenu", (event) => event.preventDefault());
});
const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "jump", " ": "jump", a: "left", d: "right", w: "jump" };
addEventListener("keydown", (event) => { if (KEYMAP[event.key]) keys[KEYMAP[event.key]] = true; });
addEventListener("keyup", (event) => { if (KEYMAP[event.key]) keys[KEYMAP[event.key]] = false; });

starsAtStart = 0;
load();
requestAnimationFrame(loop);
</script>
</body>
</html>
