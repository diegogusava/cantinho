<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4a8c8">
<link rel="stylesheet" href="common.css?v=10">
<title>Memória</title>
<style>
  html, body { background: #f4a8c8; }
  #grid { display: grid; gap: 10px; width: max-content; max-width: calc(100% - 24px); margin: 70px auto 12px; }
  .card { aspect-ratio: 1; width: min(calc((min(100vw, 520px) - 24px - (var(--cols) - 1) * 10px) / var(--cols)), calc((100svh - 96px - env(safe-area-inset-bottom) - (var(--rows) - 1) * 10px) / var(--rows))); min-width: 0; min-height: 0; font-size: inherit; font-weight: 800; line-height: 1; display: grid; place-items: center; border: 0; border-radius: 22px; background: var(--player, #e8688f); color: #fff; padding: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 0 color-mix(in srgb, var(--player, #e8688f) 62%, #241428); transition: transform .12s ease; }
  .card:active { transform: scale(.96); }
  .card.up { background: #fff; box-shadow: 0 8px 18px rgba(61, 44, 78, .12); }
  .card.done { background: #fff; box-shadow: inset 0 0 0 3px var(--player), 0 8px 18px rgba(61, 44, 78, .12); }
  .hud { font-size: 1.05rem; max-width: calc(100% - 70px); color: #3d2c4e; }
  .hud span { color: var(--color); border: 0; border-radius: 999px; padding: 2px 8px; background: #fff; }
  .hud span.now { color: #fff; background: var(--color); }
  #players { position: fixed; inset: 0; z-index: 7; background: #f4a8c8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #players[hidden] { display: none; }
  #players h1 { color: #3d2c4e; margin: 0 0 8px; }
  #players button { width: min(260px, 80vw); padding: 14px; font-size: 1.6rem; font-weight: 700; border: 0; border-radius: 18px; background: #fff; color: #3d2c4e; box-shadow: 0 4px 0 #de8eb0; }
  #players .names { display: flex; flex-direction: column; gap: 10px; }
  #players input { width: min(260px, 80vw); padding: 10px 12px; font-size: 1.3rem; font-weight: 700; border: 0; border-radius: 14px; color: var(--color); text-align: center; user-select: text; touch-action: auto; box-shadow: inset 0 0 0 3px var(--color); }
  #players #go { background: #e8688f; color: #fff; box-shadow: 0 4px 0 #c45a7c; }
  #next { white-space: nowrap; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; padding: 14px 32px; font-size: 1.6rem; font-weight: 700; border: 0; border-radius: 18px; background: #e8688f; color: #fff; box-shadow: 0 4px 0 #c45a7c; }
  .banner { color: #e8688f; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  #next[hidden] { display: none; }
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<a class="back" href="index.html">🏠</a>
<div id="grid"></div>
<div id="players"></div>
<div class="banner" id="banner"></div>
<button id="next" hidden>Próximo ▶</button>
<script src="common.js"></script>
<script src="cheer.js"></script>
<script>
const EMOJIS = ["🐶", "🐱", "🐭", "🐰", "🦊", "🐻", "🐼", "🐸", "🐵", "🐧", "🦁", "🐯", "🐷", "🐮", "🦄", "🐙", "🐠", "🦋", "🐝", "🦜", "🐢", "🦕", "👸", "🧚", "⛄", "🤖", "👻", "🎃", "🚗", "🚀", "⭐", "🍦"];
const PLAYER_COLORS = ["#e8688f", "#5b6cff", "#12b5a0", "#f5a524"];
const PAIRS_PER_LEVEL = [3, 4, 6, 8, 10, 12];
const grid = document.getElementById("grid");
const hud = document.getElementById("hud");
const banner = document.getElementById("banner");

let level = savedLevel("memory", 0);
let scores = [];
let turn = 0;
let open = [];
let locked = false;
let remaining = 0;
let cardCount = 0;

const playersMenu = document.getElementById("players");
const nextButton = document.getElementById("next");
let names = loadNames();

function loadNames() {
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem("memory:names")) || []; } catch {}
  return PLAYER_COLORS.map((_, i) => (typeof stored[i] === "string" && stored[i].trim()) || "J" + (i + 1));
}

function saveNames() {
  try { localStorage.setItem("memory:names", JSON.stringify(names)); } catch {}
}

function heading(text) {
  return Object.assign(document.createElement("h1"), { textContent: text });
}

function askCount() {
  playersMenu.replaceChildren(heading("Quantos jogadores?"));
  [1, 2, 3, 4].forEach((count) => {
    const button = document.createElement("button");
    button.textContent = count === 1 ? "1 jogador" : count + " jogadores";
    button.onclick = () => askNames(count);
    playersMenu.append(button);
  });
  playersMenu.hidden = false;
}

function askNames(count) {
  const list = document.createElement("div");
  list.className = "names";
  const inputs = Array.from({ length: count }, (_, i) => {
    const input = document.createElement("input");
    input.value = names[i];
    input.maxLength = 12;
    input.placeholder = "J" + (i + 1);
    input.style.setProperty("--color", PLAYER_COLORS[i]);
    input.onfocus = () => input.select();
    list.append(input);
    return input;
  });
  const go = document.createElement("button");
  go.id = "go";
  go.textContent = "Começar ▶";
  go.onclick = () => {
    inputs.forEach((input, i) => { names[i] = input.value.trim() || "J" + (i + 1); });
    saveNames();
    scores = Array(count).fill(0);
    playersMenu.hidden = true;
    start();
  };
  const back = document.createElement("button");
  back.textContent = "◀ Voltar";
  back.onclick = askCount;
  playersMenu.replaceChildren(heading(count === 1 ? "Seu nome" : "Nomes"), list, go, back);
}

nextButton.onclick = () => {
  nextButton.hidden = true;
  saveLevel("memory", ++level);
  scores = scores.map(() => 0);
  start();
};

askCount();

function showHud() {
  document.body.style.setProperty("--player", PLAYER_COLORS[turn]);
  hud.replaceChildren("Nível " + (level + 1) + (scores.length === 1 ? " · " + names[0] : ""));
  if (scores.length === 1) return;
  scores.forEach((score, i) => {
    const tag = document.createElement("span");
    tag.className = i === turn ? "now" : "";
    tag.style.setProperty("--color", PLAYER_COLORS[i]);
    tag.textContent = names[i] + ": " + score;
    hud.append(" ", tag);
  });
}

function columnsFor(cards) {
  const width = Math.min(window.innerWidth, 520) - 24;
  const height = window.innerHeight - 96;
  const options = [];
  for (let cols = 2; cols <= Math.min(8, cards / 2); cols++) {
    if (cards % cols !== 0 || cards / cols > 8) continue;
    const rows = cards / cols;
    options.push({
      cols,
      size: Math.min((width - 10 * (cols - 1)) / cols, (height - 10 * (rows - 1)) / rows),
    });
  }
  const wide = options.filter((option) => option.cols >= 3 && option.size >= 38);
  const roomy = options.filter((option) => option.size >= 48);
  const pool = wide.length ? wide : roomy.length ? roomy : options;
  pool.sort((a, b) => Math.abs(a.cols - 4) - Math.abs(b.cols - 4) || b.size - a.size);
  return pool[0] ? pool[0].cols : 4;
}

function applyColumns(cards) {
  cardCount = cards;
  const columns = columnsFor(cards);
  grid.style.setProperty("--cols", columns);
  grid.style.setProperty("--rows", cards / columns);
  grid.style.gridTemplateColumns = "repeat(" + columns + ", max-content)";
}

function fitEmoji() {
  const card = grid.querySelector(".card");
  if (!card) return;
  grid.style.fontSize = Math.min(40, card.clientWidth * 0.46) + "px";
}

window.addEventListener("resize", () => {
  if (!cardCount) return;
  applyColumns(cardCount);
  fitEmoji();
});

function start() {
  const pairs = Math.min(EMOJIS.length, PAIRS_PER_LEVEL[Math.min(level, PAIRS_PER_LEVEL.length - 1)] + 2 * (scores.length - 1));
  const faces = shuffle([...EMOJIS]).slice(0, pairs);
  remaining = pairs;
  open = [];
  locked = false;
  banner.textContent = "";
  turn = 0;
  showHud();
  applyColumns(pairs * 2);
  grid.replaceChildren(...shuffle([...faces, ...faces]).map((face) => {
    const card = document.createElement("button");
    card.className = "card";
    card.textContent = "?";
    card.onclick = () => flip(card, face);
    return card;
  }));
  fitEmoji();
}

function flip(card, face) {
  if (locked || open.some((o) => o.card === card) || card.classList.contains("done")) return;
  card.classList.add("up");
  card.textContent = face;
  beep(400 + EMOJIS.indexOf(face) * 40, 0.15);
  open.push({ card, face });
  if (open.length < 2) return;

  const [a, b] = open;
  open = [];
  if (a.face === b.face) {
    [a, b].forEach((o) => { o.card.style.setProperty("--player", PLAYER_COLORS[turn]); o.card.classList.add("done"); });
    beep(880, 0.3);
    scores[turn]++;
    showHud();
    if (--remaining === 0) win();
    return;
  }
  locked = true;
  setTimeout(() => {
    [a, b].forEach((o) => { o.card.classList.remove("up"); o.card.textContent = "?"; });
    turn = (turn + 1) % scores.length;
    showHud();
    locked = false;
  }, 800);
}

function win() {
  const best = Math.max(...scores);
  const winners = scores.flatMap((score, i) => (score === best ? [names[i]] : []));
  banner.textContent = scores.length === 1 ? "Parabéns, " + names[0] + "! 💖" : winners.length > 1 ? "Empate! " + winners.join(" e ") + " 💖" : winners[0] + " ganhou! 💖";
  cheer("win");
  setTimeout(() => { nextButton.hidden = false; }, 1000);
}
</script>
</body>
</html>
