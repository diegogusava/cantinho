<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<link rel="stylesheet" href="common.css">
<title>Memória</title>
<style>
  #grid { display: grid; gap: 10px; padding: 70px 12px 12px; max-width: 520px; margin: 0 auto; }
  .card { aspect-ratio: 1; font-size: clamp(2rem, 12vw, 3.4rem); border: 3px solid var(--player, #ff4fa3); border-radius: 16px; background: var(--player, #ff4fa3); color: #fff; padding: 0; }
  .card.up { background: #fff; }
  .hud { font-size: 1.1rem; max-width: calc(100% - 70px); }
  .hud span { color: var(--color); border: 2px solid var(--color); border-radius: 8px; padding: 0 6px; }
  .hud span.now { color: #fff; background: var(--color); }
  #players { position: fixed; inset: 0; z-index: 7; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #players[hidden] { display: none; }
  #players h1 { color: #ff4fa3; margin: 0 0 8px; }
  #players button { width: min(260px, 80vw); padding: 14px; font-size: 1.6rem; font-weight: 700; border: 3px solid #ff4fa3; border-radius: 16px; background: #fff; color: #ff4fa3; }
  .card.done { background: var(--player); border-color: var(--player); }
  #players .names { display: flex; flex-direction: column; gap: 10px; }
  #players input { width: min(260px, 80vw); padding: 10px 12px; font-size: 1.3rem; font-weight: 700; border: 3px solid var(--color); border-radius: 12px; color: var(--color); text-align: center; user-select: text; touch-action: auto; }
  #players #go { background: #ff4fa3; color: #fff; }
  #next { white-space: nowrap; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; padding: 14px 32px; font-size: 1.6rem; font-weight: 700; border: 3px solid #fff; border-radius: 16px; background: #ff4fa3; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  #next[hidden] { display: none; }
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<a class="back" href="index.html">🏠</a>
<div id="grid"></div>
<div id="players"></div>
<div class="banner" id="banner"></div>
<button id="next" hidden>Próximo ▶</button>
<script src="common.js"></script>
<script src="cheer.js"></script>
<script>
const EMOJIS = ["🐶", "🐱", "🐭", "🐰", "🦊", "🐻", "🐼", "🐸", "🍎", "🍌", "🍓", "🍇", "🦁", "🐯", "🐵", "🐧"];
const PLAYER_COLORS = ["#ff4fa3", "#2196f3", "#2eb872", "#ff9800"];
const PAIRS_PER_LEVEL = [3, 4, 6, 8, 10, 12];
const grid = document.getElementById("grid");
const hud = document.getElementById("hud");
const banner = document.getElementById("banner");

let level = savedLevel("memory", 0);
let scores = [];
let turn = 0;
let open = [];
let locked = false;
let remaining = 0;

const playersMenu = document.getElementById("players");
const nextButton = document.getElementById("next");
let names = loadNames();

function loadNames() {
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem("memory:names")) || []; } catch {}
  return PLAYER_COLORS.map((_, i) => (typeof stored[i] === "string" && stored[i].trim()) || "J" + (i + 1));
}

function saveNames() {
  try { localStorage.setItem("memory:names", JSON.stringify(names)); } catch {}
}

function heading(text) {
  return Object.assign(document.createElement("h1"), { textContent: text });
}

function askCount() {
  playersMenu.replaceChildren(heading("Quantos jogadores?"));
  [1, 2, 3, 4].forEach((count) => {
    const button = document.createElement("button");
    button.textContent = count === 1 ? "1 jogador" : count + " jogadores";
    button.onclick = () => askNames(count);
    playersMenu.append(button);
  });
  playersMenu.hidden = false;
}

function askNames(count) {
  const list = document.createElement("div");
  list.className = "names";
  const inputs = Array.from({ length: count }, (_, i) => {
    const input = document.createElement("input");
    input.value = names[i];
    input.maxLength = 12;
    input.placeholder = "J" + (i + 1);
    input.style.setProperty("--color", PLAYER_COLORS[i]);
    input.onfocus = () => input.select();
    list.append(input);
    return input;
  });
  const go = document.createElement("button");
  go.id = "go";
  go.textContent = "Começar ▶";
  go.onclick = () => {
    inputs.forEach((input, i) => { names[i] = input.value.trim() || "J" + (i + 1); });
    saveNames();
    scores = Array(count).fill(0);
    playersMenu.hidden = true;
    start();
  };
  const back = document.createElement("button");
  back.textContent = "◀ Voltar";
  back.onclick = askCount;
  playersMenu.replaceChildren(heading(count === 1 ? "Seu nome" : "Nomes"), list, go, back);
}

nextButton.onclick = () => {
  nextButton.hidden = true;
  saveLevel("memory", ++level);
  scores = scores.map(() => 0);
  start();
};

askCount();

function showHud() {
  document.body.style.setProperty("--player", PLAYER_COLORS[turn]);
  hud.replaceChildren("Nível " + (level + 1) + (scores.length === 1 ? " · " + names[0] : ""));
  if (scores.length === 1) return;
  scores.forEach((score, i) => {
    const tag = document.createElement("span");
    tag.className = i === turn ? "now" : "";
    tag.style.setProperty("--color", PLAYER_COLORS[i]);
    tag.textContent = names[i] + ": " + score;
    hud.append(" ", tag);
  });
}

function start() {
  const pairs = Math.min(EMOJIS.length, PAIRS_PER_LEVEL[Math.min(level, PAIRS_PER_LEVEL.length - 1)] + 2 * (scores.length - 1));
  const faces = shuffle([...EMOJIS]).slice(0, pairs);
  remaining = pairs;
  open = [];
  locked = false;
  banner.textContent = "";
  turn = 0;
  showHud();
  grid.style.gridTemplateColumns = "repeat(" + (pairs === 3 ? 3 : pairs * 2 <= 24 ? 4 : 5) + ", 1fr)";
  grid.replaceChildren(...shuffle([...faces, ...faces]).map((face) => {
    const card = document.createElement("button");
    card.className = "card";
    card.textContent = "❓";
    card.onclick = () => flip(card, face);
    return card;
  }));
}

function flip(card, face) {
  if (locked || open.some((o) => o.card === card) || card.classList.contains("done")) return;
  card.classList.add("up");
  card.textContent = face;
  beep(400 + EMOJIS.indexOf(face) * 40, 0.15);
  open.push({ card, face });
  if (open.length < 2) return;

  const [a, b] = open;
  open = [];
  if (a.face === b.face) {
    [a, b].forEach((o) => { o.card.style.setProperty("--player", PLAYER_COLORS[turn]); o.card.classList.add("done"); });
    beep(880, 0.3);
    scores[turn]++;
    showHud();
    if (--remaining === 0) win();
    return;
  }
  locked = true;
  setTimeout(() => {
    [a, b].forEach((o) => { o.card.classList.remove("up"); o.card.textContent = "❓"; });
    turn = (turn + 1) % scores.length;
    showHud();
    locked = false;
  }, 800);
}

function win() {
  const best = Math.max(...scores);
  const winners = scores.flatMap((score, i) => (score === best ? [names[i]] : []));
  banner.textContent = scores.length === 1 ? "Parabéns, " + names[0] + "! 💖" : winners.length > 1 ? "Empate! " + winners.join(" e ") + " 💖" : winners[0] + " ganhou! 💖";
  cheer("win");
  setTimeout(() => { nextButton.hidden = false; }, 1000);
}
</script>
</body>
</html>
