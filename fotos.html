<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<title>Fotos do quebra-cabeça</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #fff; color: #333; }
  h1 { color: #ff4fa3; margin-top: 0; }
  input, button, label.upload { font-size: 1.1rem; padding: 10px 14px; border-radius: 10px; border: 2px solid #ff4fa3; background: #fff; color: #ff4fa3; }
  label.upload { display: inline-block; background: #ff4fa3; color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
  figure { margin: 0; text-align: center; }
  img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; border: 4px solid #ccc; }
  figure.released img { border-color: #3ddc84; }
  figure button { margin: 4px 2px 0; padding: 6px 10px; font-size: .9rem; }
</style>
</head>
<body>
<div id="gate">
  <h1 id="gate-title"></h1>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
  <button id="unlock">Entrar</button>
</div>
<div id="panel" hidden>
  <h1>Fotos do quebra-cabeça</h1>
  <label class="upload">+ Adicionar fotos<input id="file" type="file" accept="image/*" multiple hidden></label>
  <a href="jogos.html">🏠</a>
  <p>Verde = liberada pra ela. Só fica neste aparelho.</p>
  <div id="grid"></div>
</div>
<script src="photos.js"></script>
<script>
const pinKey = "puzzle-pin";
const gate = document.getElementById("gate");
const panel = document.getElementById("panel");
const pin = document.getElementById("pin");
const grid = document.getElementById("grid");

document.getElementById("gate-title").textContent = localStorage.getItem(pinKey) ? "PIN dos pais" : "Crie um PIN";

document.getElementById("unlock").onclick = () => {
  if (!pin.value) return;
  if (!localStorage.getItem(pinKey)) localStorage.setItem(pinKey, pin.value);
  if (pin.value !== localStorage.getItem(pinKey)) { pin.value = ""; return; }
  gate.hidden = true;
  panel.hidden = false;
  render();
};

document.getElementById("file").onchange = async (event) => {
  for (const file of event.target.files) await addPhoto(file);
  event.target.value = "";
  render();
};

async function render() {
  grid.replaceChildren();
  for (const photo of await listPhotos()) {
    const figure = document.createElement("figure");
    figure.className = photo.released ? "released" : "";
    const img = new Image();
    img.src = URL.createObjectURL(photo.blob);
    const toggle = document.createElement("button");
    toggle.textContent = photo.released ? "Esconder" : "Liberar";
    toggle.onclick = async () => { await savePhoto({ ...photo, released: !photo.released }); render(); };
    const remove = document.createElement("button");
    remove.textContent = "🗑";
    remove.onclick = async () => { await removePhoto(photo.id); render(); };
    figure.append(img, toggle, remove);
    grid.append(figure);
  }
}
</script>
</body>
</html>
