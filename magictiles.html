<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<title>Magic Tiles</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: rgba(255, 79, 163, .94); color: #fff; text-align: center; }
  #menu[hidden] { display: none; }
  h1 { margin: 0; font-size: 2.4rem; }
  #result { min-height: 1.5em; font-size: 1.2rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; font-size: 1.1rem; padding: 12px 18px; border: 3px solid #fff; border-radius: 14px; background: transparent; color: #fff; }
  button.on { background: #fff; color: #ff4fa3; font-weight: 700; }
  #play { font-size: 1.6rem; padding: 16px 40px; }
  button:disabled { opacity: .5; }
  #songs button { min-width: 240px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu">
  <h1>Magic Tiles</h1>
  <div id="result"></div>
  <button id="play" class="on"></button>
  <div class="row" id="levels"></div>
  <div class="row" id="songs"></div>
</div>
<script src="cheer.js"></script>
<script src="songs.js"></script>
<script src="game.js"></script>
</body>
</html>
